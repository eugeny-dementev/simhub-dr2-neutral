name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  SIMHUB_VERSION: 9.11.22
  SIMHUB_SHA256: D2239182E07A74B5A2B14782F256C63ACB2B4126CD75FBDF760F8A227376E895

jobs:
  release:
    name: Verify and publish
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            src/packages.lock.json
            tests/packages.lock.json

      - name: Validate release version
        id: version
        shell: pwsh
        run: |
          $version = & .\scripts\Test-Version.ps1 -Tag $env:GITHUB_REF_NAME
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Prepare verified SimHub build inputs
        shell: pwsh
        run: |
          $simHubPath = Join-Path $env:RUNNER_TEMP "SimHub-$env:SIMHUB_VERSION"
          & .\scripts\Get-SimHubSdk.ps1 `
            -Version $env:SIMHUB_VERSION `
            -ExpectedSha256 $env:SIMHUB_SHA256 `
            -Destination $simHubPath
          "SIMHUB_PATH=$simHubPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build, test, and package
        shell: pwsh
        run: .\package.ps1 -SimHubPath $env:SIMHUB_PATH -Version "${{ steps.version.outputs.version }}"

      - name: Attest release package provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/DR2Neutral-${{ steps.version.outputs.version }}-SimHub.zip

      - name: Preserve workflow artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DR2Neutral-${{ steps.version.outputs.version }}-release
          path: |
            artifacts/DR2Neutral-${{ steps.version.outputs.version }}-SimHub.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $archive = "artifacts\DR2Neutral-$version-SimHub.zip"
          $checksums = "artifacts\SHA256SUMS.txt"
          $notes = @'
          Ready-to-install community package for SimHub and DiRT Rally 2.0.

          Download the ZIP and checksum manifest below, verify them, extract the
          entire ZIP, and run `Install.cmd`. Calibration is built into the
          plugin's **DR2 Neutral** page in SimHub.

          Read the repository README and CHANGELOG before installation. Select
          Neutral only while stationary or nearly stationary, preferably with
          the clutch held.
          '@
          & gh release create $env:GITHUB_REF_NAME `
            --repo $env:GITHUB_REPOSITORY `
            --verify-tag `
            --title "DR2 Neutral Selector $version" `
            --generate-notes `
            --notes $notes `
            $archive $checksums
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release creation failed with exit code $LASTEXITCODE."
          }
