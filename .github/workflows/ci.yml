name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SIMHUB_VERSION: 9.11.22
  SIMHUB_SHA256: D2239182E07A74B5A2B14782F256C63ACB2B4126CD75FBDF760F8A227376E895

jobs:
  build:
    name: Build, test, and package
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            src/packages.lock.json
            tests/packages.lock.json

      - name: Prepare verified SimHub build inputs
        shell: pwsh
        run: |
          $simHubPath = Join-Path $env:RUNNER_TEMP "SimHub-$env:SIMHUB_VERSION"
          & .\scripts\Get-SimHubSdk.ps1 `
            -Version $env:SIMHUB_VERSION `
            -ExpectedSha256 $env:SIMHUB_SHA256 `
            -Destination $simHubPath
          "SIMHUB_PATH=$simHubPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build, test, and package
        shell: pwsh
        run: .\package.ps1 -SimHubPath $env:SIMHUB_PATH

      - name: Upload package for inspection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DR2Neutral-ci-${{ github.sha }}
          path: |
            artifacts/DR2Neutral-*-SimHub.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
