version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci
    open-pull-requests-limit: 5

  - package-ecosystem: nuget
    directory: /src
    schedule:
      interval: monthly
    labels:
      - dependencies
    open-pull-requests-limit: 5

  - package-ecosystem: nuget
    directory: /tests
    schedule:
      interval: monthly
    labels:
      - dependencies
      - tests
    open-pull-requests-limit: 5
